<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>TT Tracker ADMIN</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#111827}header{padding:18px;background:#111827;color:white}main{max-width:1100px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}input,button{padding:11px;border:1px solid #d1d5db;border-radius:9px}button{background:#111827;color:#fff;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.device{border-top:1px solid #eee;padding:12px 0}.muted{color:#6b7280;font-size:13px}</style></head><body><header><b>TT TRACKER — ADMIN</b></header><main><section class="card"><h3>Kết nối máy chủ</h3><div class="row"><input id="api" placeholder="https://server-cua-ban"><input id="token" type="password" placeholder="ADMIN TOKEN"><button onclick="loadDevices()">Đăng nhập / Tải thiết bị</button></div><p class="muted">Chỉ dùng để quản lý các thiết bị đã đồng ý chia sẻ vị trí.</p></section><section class="card"><h3>Thiết bị</h3><div id="devices">Chưa kết nối.</div></section></main><script>const $=id=>document.getElementById(id);function headers(){return {Authorization:'Bearer '+$('token').value}}async function loadDevices(){try{const r=await fetch($('api').value.replace(/\/$/,'')+'/api/devices',{headers:headers()});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();$('devices').innerHTML=d.length?d.map(x=>`<div class="device"><b>${esc(x.device_id)}</b><br>📍 ${x.lat}, ${x.lon}<br><span class="muted">Độ chính xác: ${x.accuracy??'-'} m · Cập nhật: ${new Date(x.last_seen).toLocaleString()}</span><br><button onclick="history('${encodeURIComponent(x.device_id)}')">Xem lịch sử</button></div>`).join(''):'Không có thiết bị.'}catch(e){$('devices').textContent='Lỗi kết nối: '+e.message}}async function history(id){try{const r=await fetch($('api').value.replace(/\/$/,'')+'/api/devices/'+id+'/history',{headers:headers()});const d=await r.json();alert('Có '+d.length+' điểm lịch sử.\nĐiểm đầu: '+(d[0]?d[0].lat+', '+d[0].lon:'-')+'\nĐiểm cuối: '+(d.at(-1)?d.at(-1).lat+', '+d.at(-1).lon:'-'))}catch(e){alert(e.message)}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
